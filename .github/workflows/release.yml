name: Release

on:
  release:
    types: [published]

env:
  FLUTTER_VERSION: '3.9.0'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Run tests
      run: flutter test

    - name: Build web
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      run: |
        flutter build web --release --no-tree-shake-icons \
          --dart-define=ENVIRONMENT=production \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Build Android APK
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      run: |
        flutter build apk --release --split-per-abi \
          --dart-define=ENVIRONMENT=production \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Build Android App Bundle
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      run: |
        flutter build appbundle --release \
          --dart-define=ENVIRONMENT=production \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"


    - name: Create release archive
      run: |
        mkdir -p releases
        tar -czf releases/web-${{ github.event.release.tag_name }}.tar.gz -C build/web .
        cp build/app/outputs/flutter-apk/*.apk releases/
        cp build/app/outputs/bundle/release/app-release.aab releases/
        
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./releases/
        asset_name: choir-management-${{ github.event.release.tag_name }}
        asset_content_type: application/zip

  deploy-stores:
    name: Deploy to App Stores
    runs-on: ubuntu-latest
    needs: build-and-release
    if: github.event.release.prerelease == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get

    - name: Build Android App Bundle
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      run: |
        flutter build appbundle --release \
          --dart-define=ENVIRONMENT=production \
          --dart-define=SUPABASE_URL="$SUPABASE_URL" \
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    - name: Deploy to Google Play Console
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        packageName: com.choirmanagement.app
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: production
        status: completed